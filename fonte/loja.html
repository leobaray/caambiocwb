<main id="conteudo">

    <div class="page-header">
      <div class="container">
        <nav class="breadcrumbs" aria-label="Você está em">
          <a href="/">Início</a>
          <span class="sep" aria-hidden="true">/</span>
          <span class="current">Catálogo de peças</span>
        </nav>
        <h1>Catálogo de peças</h1>
        <p>
          347 peças em 40 transmissões, com foto de cada uma. Filtre pelo modelo
          do câmbio na lateral ou busque pelo nome da peça, pelo veículo ou pelo
          código da transmissão.
        </p>
      </div>
    </div>

    <section class="section">
      <div class="container shop-layout">

        <details class="filters" id="filters">
          <summary class="filters-head">
            <h2>Buscar por transmissão</h2>
            <svg class="ico chev" aria-hidden="true"><use href="#i-chevron-down"></use></svg>
          </summary>
          <div class="filters-body">
            <label class="search-field">
              <span class="sr-only">Filtrar a lista de transmissões</span>
              <svg class="ico" aria-hidden="true"><use href="#i-filter"></use></svg>
              <input type="search" id="category-filter" placeholder="Filtrar transmissão" autocomplete="off" />
            </label>
            <ul class="categories" id="categories"></ul>
            <p class="categories-empty" id="categories-empty" hidden>Nenhuma transmissão com esse nome.</p>
          </div>
        </details>

        <div>
          <div class="shop-toolbar">
            <div class="shop-toolbar-title">
              <h2 id="shop-title">Todos os produtos</h2>
              <span class="count" id="shop-count"></span>
            </div>
            <label class="search-field shop-search">
              <span class="sr-only">Buscar peça</span>
              <svg class="ico" aria-hidden="true"><use href="#i-magnifying-glass"></use></svg>
              <input type="search" id="product-search" placeholder="Buscar peça, veículo ou câmbio" autocomplete="off" />
            </label>
          </div>

          <div class="filter-tags" id="filter-tags" hidden></div>

          <div class="products-grid" id="products-grid" aria-live="polite"></div>

          <div class="load-more" id="load-more" hidden>
            <button class="btn btn-outline" type="button">Ver mais peças</button>
            <p></p>
          </div>

          <noscript>
            <div class="empty-state">
              <svg class="ico" aria-hidden="true"><use href="#i-triangle-exclamation"></use></svg>
              <h2>O catálogo precisa de JavaScript</h2>
              <p>Ative o JavaScript para navegar pelas peças ou fale direto com a gente — respondemos rápido no WhatsApp.</p>
              <a class="btn btn-wa" href="https://wa.me/5541996939384" target="_blank" rel="noopener">
                <svg class="ico" aria-hidden="true"><use href="#i-whatsapp"></use></svg> Falar no WhatsApp
              </a>
            </div>
          </noscript>
        </div>

      </div>
    </section>

  </main>
